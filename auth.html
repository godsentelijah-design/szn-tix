<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Suite — SZN TIX</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#a855f7', 600: '#9333ea' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans min-h-screen flex items-center justify-center p-6 selection:bg-purple-500 selection:text-white">

    <!-- Auth Card Container -->
    <div class="w-full max-w-md bg-neutral-900/60 border border-neutral-800/80 rounded-3xl p-8 backdrop-blur-xl shadow-2xl relative">
        
        <!-- Top Brand Header -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 mb-4">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-black text-white text-sm shadow-lg shadow-purple-600/30">S</div>
            </a>
            <h1 class="text-2xl font-black text-white tracking-tight" id="authTitle">Welcome Back</h1>
            <p class="text-xs text-neutral-400 mt-1" id="authSubtitle">Sign in to manage your tickets or access organizer suites.</p>
        </div>

        <!-- Toggle Switch Tabs -->
        <div class="grid grid-cols-2 bg-neutral-950 border border-neutral-800 p-1 rounded-2xl mb-6">
            <button onclick="switchMode('login')" id="tabLogin" class="py-2 rounded-xl text-xs font-bold bg-purple-600 text-white transition shadow-md">Sign In</button>
            <button onclick="switchMode('register')" id="tabRegister" class="py-2 rounded-xl text-xs font-bold text-neutral-400 hover:text-white transition">Create Account</button>
        </div>

        <!-- Form Container -->
        <form id="authForm" onsubmit="event.preventDefault(); alert('Authentication action simulated successfully!');" class="space-y-4">
            
            <div id="nameFieldContainer" class="hidden">
                <label class="block text-xs font-semibold text-neutral-400 mb-1">Full Name</label>
                <input type="text" id="nameInput" placeholder="Alex Johnson" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-neutral-400 mb-1">Email Address</label>
                <input type="email" required placeholder="alex@domain.com" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-neutral-400 mb-1">Password</label>
                <input type="password" required placeholder="••••••••" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
            </div>

            <div id="roleFieldContainer" class="hidden">
                <label class="block text-xs font-semibold text-neutral-400 mb-1">Account Role</label>
                <select class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500 transition">
                    <option value="attendee">Attendee (Buy tickets & check-in)</option>
                    <option value="organizer">Event Organizer (Publish events & scan doors)</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 rounded-xl text-xs transition shadow-lg shadow-purple-600/30 mt-2">
                Sign In to SZN TIX
            </button>
        </form>

        <!-- Quick navigation back -->
        <div class="mt-6 text-center border-t border-neutral-800 pt-6">
            <a href="index.html" class="text-xs text-neutral-500 hover:text-neutral-300 transition">&larr; Return to Explore Events</a>
        </div>
    </div>

    <!-- Client-side Mode Switcher Script -->
    <script>
        function switchMode(mode) {
            const title = document.getElementById('authTitle');
            const subtitle = document.getElementById('authSubtitle');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const nameField = document.getElementById('nameFieldContainer');
            const roleField = document.getElementById('roleFieldContainer');
            const submitBtn = document.getElementById('submitBtn');

            if(mode === 'login') {
                title.innerText = "Welcome Back";
                subtitle.innerText = "Sign in to manage your tickets or access organizer suites.";
                tabLogin.className = "py-2 rounded-xl text-xs font-bold bg-purple-600 text-white transition shadow-md";
                tabRegister.className = "py-2 rounded-xl text-xs font-bold text-neutral-400 hover:text-white transition";
                nameField.classList.add('hidden');
                roleField.classList.add('hidden');
                submitBtn.innerText = "Sign In to SZN TIX";
            } else {
                title.innerText = "Create Account";
                subtitle.innerText = "Get started with secure ticketing and event management.";
                tabRegister.className = "py-2 rounded-xl text-xs font-bold bg-purple-600 text-white transition shadow-md";
                tabLogin.className = "py-2 rounded-xl text-xs font-bold text-neutral-400 hover:text-white transition";
                nameField.classList.remove('hidden');
                roleField.classList.remove('hidden');
                submitBtn.innerText = "Create Account Pass";
            }
        }
    </script>
</body>
</html>
